<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" href="./images/logo.png">
    <title>%VUE_APP_TITLE%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!--EZ_CONFIG_SCRIPT-->
    <style>
        @media (min-width: 769px) {
            html, body, div, main, section, article, aside, nav {
                scrollbar-width: none !important;
                -ms-overflow-style: none !important;
            }

            ::-webkit-scrollbar, ::-webkit-scrollbar-button, ::-webkit-scrollbar-track, ::-webkit-scrollbar-track-piece, ::-webkit-scrollbar-thumb, ::-webkit-scrollbar-corner, ::-webkit-resizer {
                display: none !important;
                width: 0 !important;
                height: 0 !important;
                background: transparent !important;
            }
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        @media (min-width: 769px) {
            * {
                scrollbar-width: none !important;
                -ms-overflow-style: none !important;
            }
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            height: 100%;
        }

        html.preloader-active, body.preloader-active {
            overflow: hidden !important;
        }
    </style>
    <style>
        .app-version {
            position: fixed;
            left: 6px;
            bottom: 4px;
            font-size: 9px;
            color: rgba(0, 0, 0, 0.35);
            user-select: none;
            pointer-events: none;
            z-index: 5;
        }
    </style>

<!-- 引入 LXGW Bright Medium (中等粗细) Web Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chinese-fonts/lxgwwenkaibright@2.0.0/dist/LXGWBright-Medium/result.min.css">
    <style>
      body, #app, * {
        font-family: "LXGW Bright", "LXGW WenKai Bright", sans-serif !important;
        font-weight: 500 !important; /* 强制提升全局字体的粗细度 */
        -webkit-font-smoothing: antialiased; /* 开启抗锯齿，让字体边缘更平滑锐利 */
        -moz-osx-font-smoothing: grayscale;
        white-space: pre-line !important;
      }
    </style>
    
</head>
<body>
<div id="app"></div>
<div class="app-version">v0.4.0</div>
<script type="module" src="/src/main.js"></script>
    
<!-- 👇👇 强制锁定标题的黑魔法脚本 👇👇 -->
<script>
  window.addEventListener('load', function() {
    // 这里填入你真正想在标签页显示的精简名称
    const myRealTitle = "月之暗面 Cloud"; 
    
    const titleElement = document.querySelector('title');
    if (titleElement) {
      // 派一个“观察者”死死盯住标题标签
      new MutationObserver(function() {
        // 只要标题不是我们设定的名字，就强制给它拽回来
        if (document.title !== myRealTitle) {
          document.title = myRealTitle;
        }
      }).observe(titleElement, { childList: true });
    }
  });
</script>
<!-- 👆👆 黑魔法到此结束 👆👆 -->
    
</body>
</html>
